spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asya}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:asya}
    password: ${DB_PASSWORD}
    hikari:
      max-lifetime: 1500000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB       # 单个文件最大限制
      max-request-size: 50MB   # 单次请求的总大小限制（包含多个文件和参数）

logging:
  level:
    root: WARN

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  group-configs:
    - group: default
      paths-to-match:
        - /api/**

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-footer: false
    enable-footer-custom: true
    footer-custom-content: Asya Backend API Docs
