spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/asya-test
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:asya}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  test:
    database:
      replace: none

logging:
  level:
    root: WARN
