services:
  app:
    image: ${ASYA_IMAGE:-stanleyzh/asya-mun:latest}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/asya
      DB_USERNAME: asya
      DB_PASSWORD: ${DB_PASSWORD:-asya-local-password}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      JWT_SECRET: ${JWT_SECRET:-asya-local-jwt-secret-key-change-me-32chars}
      SERVER_PORT: "8080"
      SERVER_ADDRESS: "127.0.0.1"
    ports:
      - "3000:3000"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asya
      POSTGRES_USER: asya
      POSTGRES_PASSWORD: ${DB_PASSWORD:-asya-local-password}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asya -d asya"]
      interval: 5s
      timeout: 5s
      retries: 20
