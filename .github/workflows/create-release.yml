name: Create GitHub Release

on:
  workflow_run:
    workflows:
      - Publish Docker Image
    types:
      - completed

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-metadata
          gh run download "${{ github.event.workflow_run.id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name release-metadata \
            --dir release-metadata

      - name: Load release metadata
        id: meta
        run: |
          set -euo pipefail
          . release-metadata/release-metadata.env
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "source_sha=${SOURCE_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const target = process.env.SOURCE_SHA;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const guidance = [
              '## Deployment',
              '',
              '- This release does not upload custom binary or Docker image assets.',
              '- Source archives are available in GitHub\\'s built-in `Source code (zip)` and `Source code (tar.gz)` downloads.',
              '- Pull the latest published image before starting:',
              '  `sudo docker compose -f docker-compose.release.yml pull`',
              '- Start the stack from DockerHub with:',
              '  `sudo docker compose -f docker-compose.release.yml up -d`',
            ].join('\\n');

            const notes = await github.rest.repos.generateReleaseNotes({
              owner,
              repo,
              tag_name: tag,
              target_commitish: target,
            });

            const body = `${guidance}\\n\\n${notes.data.body}`;

            let releaseId = null;
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              releaseId = existing.data.id;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            if (releaseId) {
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: releaseId,
                tag_name: tag,
                target_commitish: target,
                name: notes.data.name,
                body,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              });
              core.info(`Updated release ${tag}`);
            } else {
              await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: notes.data.name,
                body,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              });
              core.info(`Created release ${tag}`);
            }
