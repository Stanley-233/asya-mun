name: Docker CI

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - VERSION
      - backend/**
      - frontend/**
      - scripts/**
      - .github/workflows/docker-ci.yml
  pull_request:
    branches:
      - main
    paths:
      - Dockerfile
      - VERSION
      - backend/**
      - frontend/**
      - scripts/**
      - .github/workflows/docker-ci.yml
  workflow_dispatch:

concurrency:
  group: docker-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: false
          tags: asya-mun:ci
          cache-from: type=gha,scope=docker-ci-amd64
          cache-to: type=gha,mode=max,scope=docker-ci-amd64
