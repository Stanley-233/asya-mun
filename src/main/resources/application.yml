spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asya}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:asya}
    password: ${DB_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
